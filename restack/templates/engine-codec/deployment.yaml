{{- if .Values.engine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "restack.fullname" . }}-engine-codec
  labels:
    {{- include "restack.codecLabels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/search: "true"
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "restack.codecSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "restack.codecSelectorLabels" . | nindent 8 }}
        {{- if and .Values.logs.enabled (eq .Values.cloudProvider "azure") }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "restack.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-engine-codec
          envFrom:
            - configMapRef:
                name: {{ include "restack.fullname" . }}-configmap
            - secretRef:
                name: {{ include "restack.fullname" . }}-secret
          env:
            {{- if eq .Values.cloudProvider "azure" }}
            - name: AZURE_CONTAINER_NAME
              value: {{ .Values.logs.azure.container }}
            - name: AZURE_STORAGE_ACCOUNT
              value: {{ .Values.logs.azure.storageAccount }}
            {{- else }}
            - name: BUCKET_NAME
              value: {{ .Values.logs.gcp.bucket }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: ghcr.io/restackio/restack-payload-codec-cloud:main
          imagePullPolicy: Always
          ports:
            - containerPort: 12233
              name: codec
          resources:
            limits:
              cpu: {{ .Values.payloadCodec.resources.cpu }}
              memory: {{ .Values.payloadCodec.resources.memory }}
            requests:
              cpu: {{ .Values.payloadCodec.resources.cpu }}
              memory: {{ .Values.payloadCodec.resources.memory }}

        {{- if .Values.logs.enabled }}
        # Sidecar container for logging
        - name: deployment-logs
          image: ghcr.io/restackio/k8s-logs-sidecar:main
          imagePullPolicy: Always
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEPLOYMENT_NAME
              value: {{ include "restack.fullname" . }}-engine-codec
            - name: CLOUD_PROVIDER
              value: {{ .Values.cloudProvider }}
            {{- if eq .Values.cloudProvider "azure" }}
            - name: AZURE_CONTAINER_NAME
              value: {{ .Values.logs.azure.container }}
            - name: AZURE_STORAGE_ACCOUNT
              value: {{ .Values.logs.azure.storageAccount }}
            {{- else }}
            - name: BUCKET_NAME
              value: {{ .Values.logs.gcp.bucket }}
            {{- end }}
            - name: POD_SELECTOR
              value: {{ include "restack.name" . }}-codec
            - name: CONTAINER_LOGS_NAME
              value: {{ .Chart.Name }}-engine-codec
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
